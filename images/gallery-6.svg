<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1f5432"/>
      <stop offset="100%" style="stop-color:#0f2d1a"/>
    </linearGradient>
    <linearGradient id="g6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0e0a0"/>
      <stop offset="100%" style="stop-color:#d4af37"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg6)"/>
  <!-- Sleek corporate box -->
  <rect x="90" y="160" width="220" height="160" rx="10" fill="#2a4a32" stroke="#d4af37" stroke-width="2.5"/>
  <!-- Box lid slightly open -->
  <rect x="85" y="140" width="230" height="38" rx="8" fill="#1a4428" stroke="#d4af37" stroke-width="2.5" transform="rotate(-5 200 159)"/>
  <!-- Lid inner shadow line -->
  <rect x="92" y="152" width="216" height="6" rx="3" fill="#d4af37" opacity="0.1" transform="rotate(-5 200 155)"/>
  <!-- Gold band around box -->
  <rect x="90" y="232" width="220" height="14" fill="url(#g6)" opacity="0.7"/>
  <!-- Monogram emblem on box -->
  <circle cx="200" cy="210" r="30" fill="#1a4428" stroke="#d4af37" stroke-width="2"/>
  <text x="200" y="218" text-anchor="middle" font-family="Georgia,serif" font-size="22" font-weight="bold" fill="#d4af37">AC</text>
  <!-- Tissue peeking -->
  <path d="M120,165 Q145,155 170,165 Q195,155 220,165 Q245,155 270,165" fill="none" stroke="#f0e0a0" stroke-width="3" opacity="0.4"/>
  <!-- Stars -->
  <text x="110" y="140" font-size="18" fill="#d4af37" opacity="0.45">✦</text>
  <text x="285" y="148" font-size="16" fill="#d4af37" opacity="0.4">✦</text>
  <text x="80" y="280" font-size="14" fill="#d4af37" opacity="0.35">✦</text>
  <text x="305" y="290" font-size="14" fill="#d4af37" opacity="0.35">✦</text>
  <!-- Corner decorative borders -->
  <line x1="50" y1="50" x2="90" y2="50" stroke="#d4af37" stroke-width="1.5" opacity="0.4"/>
  <line x1="50" y1="50" x2="50" y2="90" stroke="#d4af37" stroke-width="1.5" opacity="0.4"/>
  <line x1="350" y1="50" x2="310" y2="50" stroke="#d4af37" stroke-width="1.5" opacity="0.4"/>
  <line x1="350" y1="50" x2="350" y2="90" stroke="#d4af37" stroke-width="1.5" opacity="0.4"/>
  <line x1="50" y1="350" x2="90" y2="350" stroke="#d4af37" stroke-width="1.5" opacity="0.4"/>
  <line x1="50" y1="350" x2="50" y2="310" stroke="#d4af37" stroke-width="1.5" opacity="0.4"/>
  <line x1="350" y1="350" x2="310" y2="350" stroke="#d4af37" stroke-width="1.5" opacity="0.4"/>
  <line x1="350" y1="350" x2="350" y2="310" stroke="#d4af37" stroke-width="1.5" opacity="0.4"/>
  <text x="200" y="370" text-anchor="middle" font-family="Georgia,serif" font-size="14" fill="#d4af37" letter-spacing="2">CORPORATE GIFT BOX</text>
</svg>
