<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a472a"/>
      <stop offset="100%" style="stop-color:#0f2d1a"/>
    </linearGradient>
    <linearGradient id="g3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0e0a0"/>
      <stop offset="100%" style="stop-color:#d4af37"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg3)"/>
  <!-- Hexagonal frame for personalised gift -->
  <polygon points="200,60 310,120 310,240 200,300 90,240 90,120" fill="none" stroke="#d4af37" stroke-width="2" opacity="0.4"/>
  <polygon points="200,80 290,130 290,230 200,280 110,230 110,130" fill="none" stroke="#d4af37" stroke-width="1" opacity="0.3"/>
  <!-- Photo frame / plaque -->
  <rect x="130" y="130" width="140" height="160" rx="10" fill="#2a6040" stroke="#d4af37" stroke-width="3"/>
  <rect x="140" y="140" width="120" height="100" rx="6" fill="#1f5432" stroke="#d4af37" stroke-width="1"/>
  <!-- "Photo" silhouette inside frame -->
  <circle cx="200" cy="180" r="25" fill="#d4af37" opacity="0.3"/>
  <ellipse cx="200" cy="215" rx="35" ry="22" fill="#d4af37" opacity="0.2"/>
  <!-- Engraved text area -->
  <rect x="145" y="255" width="110" height="18" rx="3" fill="#d4af37" opacity="0.15"/>
  <rect x="155" y="279" width="90" height="5" rx="2" fill="#d4af37" opacity="0.25"/>
  <!-- Stars / sparkles -->
  <text x="100" y="115" font-size="28" fill="#d4af37" opacity="0.5">✦</text>
  <text x="270" y="115" font-size="22" fill="#d4af37" opacity="0.4">✦</text>
  <text x="340" y="200" font-size="18" fill="#d4af37" opacity="0.3">✦</text>
  <text x="50" y="220" font-size="18" fill="#d4af37" opacity="0.3">✦</text>
  <text x="200" y="360" text-anchor="middle" font-family="Georgia,serif" font-size="14" fill="#d4af37" letter-spacing="2">PERSONALISED KEEPSAKE</text>
  <!-- Gold leaf motif -->
  <text x="200" y="50" text-anchor="middle" font-size="22" fill="#d4af37" opacity="0.5">❧</text>
</svg>
