<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a472a"/>
      <stop offset="100%" style="stop-color:#0f2d1a"/>
    </linearGradient>
    <linearGradient id="g5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0e0a0"/>
      <stop offset="100%" style="stop-color:#d4af37"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg5)"/>
  <!-- Circular festive arrangement -->
  <circle cx="200" cy="200" r="130" fill="none" stroke="#d4af37" stroke-width="1.5" stroke-dasharray="8,6" opacity="0.3"/>
  <circle cx="200" cy="200" r="100" fill="none" stroke="#d4af37" stroke-width="1" opacity="0.2"/>
  <!-- Diya / lamp shape -->
  <ellipse cx="200" cy="240" rx="55" ry="20" fill="#2a6040" stroke="#d4af37" stroke-width="2"/>
  <path d="M145,240 Q200,195 255,240" fill="#1f5432" stroke="#d4af37" stroke-width="2"/>
  <!-- Flame -->
  <path d="M200,160 Q210,195 200,215 Q190,195 200,160" fill="url(#g5)" opacity="0.9"/>
  <path d="M200,175 Q206,195 200,210 Q194,195 200,175" fill="#f0e0a0" opacity="0.7"/>
  <!-- Glow -->
  <circle cx="200" cy="200" r="40" fill="#d4af37" opacity="0.04"/>
  <!-- Flower petals around -->
  <circle cx="200" cy="90" r="12" fill="#d4af37" opacity="0.55"/>
  <circle cx="290" cy="130" r="10" fill="#d4af37" opacity="0.45"/>
  <circle cx="320" cy="220" r="11" fill="#d4af37" opacity="0.45"/>
  <circle cx="280" cy="310" r="9" fill="#d4af37" opacity="0.4"/>
  <circle cx="200" cy="340" r="12" fill="#d4af37" opacity="0.55"/>
  <circle cx="120" cy="310" r="9" fill="#d4af37" opacity="0.4"/>
  <circle cx="80" cy="220" r="11" fill="#d4af37" opacity="0.45"/>
  <circle cx="110" cy="130" r="10" fill="#d4af37" opacity="0.45"/>
  <!-- Center decorative circle -->
  <circle cx="200" cy="200" r="18" fill="#d4af37" opacity="0.12"/>
  <!-- Stars scattered -->
  <text x="155" y="115" font-size="16" fill="#d4af37" opacity="0.5">✦</text>
  <text x="255" y="115" font-size="14" fill="#d4af37" opacity="0.45">✦</text>
  <text x="300" y="185" font-size="12" fill="#d4af37" opacity="0.4">✦</text>
  <text x="95" y="185" font-size="12" fill="#d4af37" opacity="0.4">✦</text>
  <text x="200" y="365" text-anchor="middle" font-family="Georgia,serif" font-size="14" fill="#d4af37" letter-spacing="2">FESTIVAL GIFT SET</text>
</svg>
