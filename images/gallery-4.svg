<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1f5432"/>
      <stop offset="100%" style="stop-color:#0f2d1a"/>
    </linearGradient>
    <linearGradient id="g4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0e0a0"/>
      <stop offset="100%" style="stop-color:#d4af37"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg4)"/>
  <!-- Basket base -->
  <ellipse cx="200" cy="310" rx="110" ry="30" fill="#2a4a2a" stroke="#d4af37" stroke-width="2"/>
  <!-- Basket body (weave effect) -->
  <path d="M90,310 Q90,200 200,200 Q310,200 310,310" fill="#2a4a2a" stroke="#d4af37" stroke-width="2"/>
  <!-- Basket weave lines -->
  <path d="M110,280 Q200,265 290,280" fill="none" stroke="#d4af37" stroke-width="1" opacity="0.5"/>
  <path d="M100,255 Q200,238 300,255" fill="none" stroke="#d4af37" stroke-width="1" opacity="0.4"/>
  <path d="M95,228 Q200,210 305,228" fill="none" stroke="#d4af37" stroke-width="1" opacity="0.35"/>
  <!-- Vertical weave lines -->
  <line x1="150" y1="205" x2="130" y2="305" stroke="#d4af37" stroke-width="1" opacity="0.3"/>
  <line x1="175" y1="200" x2="165" y2="308" stroke="#d4af37" stroke-width="1" opacity="0.3"/>
  <line x1="200" y1="200" x2="200" y2="310" stroke="#d4af37" stroke-width="1" opacity="0.3"/>
  <line x1="225" y1="200" x2="235" y2="308" stroke="#d4af37" stroke-width="1" opacity="0.3"/>
  <line x1="250" y1="205" x2="270" y2="305" stroke="#d4af37" stroke-width="1" opacity="0.3"/>
  <!-- Basket handle -->
  <path d="M140,200 Q140,130 200,130 Q260,130 260,200" fill="none" stroke="#d4af37" stroke-width="5" stroke-linecap="round"/>
  <!-- Baby items peeking out -->
  <!-- Small bottle -->
  <rect x="165" y="165" width="18" height="35" rx="4" fill="#d4af37" opacity="0.7"/>
  <rect x="170" y="158" width="8" height="10" rx="2" fill="#d4af37" opacity="0.5"/>
  <!-- Small ball/toy -->
  <circle cx="210" cy="185" r="15" fill="#e8cc6a" opacity="0.6"/>
  <!-- Ribbon on basket -->
  <path d="M150,205 Q200,215 250,205" fill="none" stroke="#d4af37" stroke-width="3" opacity="0.9"/>
  <!-- Bow -->
  <ellipse cx="193" cy="203" rx="16" ry="10" transform="rotate(-20 193 203)" fill="#d4af37" opacity="0.8"/>
  <ellipse cx="210" cy="203" rx="16" ry="10" transform="rotate(20 210 203)" fill="#d4af37" opacity="0.8"/>
  <circle cx="201" cy="204" r="7" fill="#d4af37"/>
  <!-- Stars -->
  <text x="80" y="160" font-size="20" fill="#d4af37" opacity="0.4">✦</text>
  <text x="305" y="175" font-size="16" fill="#d4af37" opacity="0.35">✦</text>
  <text x="200" y="365" text-anchor="middle" font-family="Georgia,serif" font-size="14" fill="#d4af37" letter-spacing="2">BABY SHOWER GIFT</text>
</svg>
