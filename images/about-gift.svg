<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 420" width="500" height="420">
  <defs>
    <linearGradient id="bg-about" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a472a"/>
      <stop offset="100%" style="stop-color:#0f2d1a"/>
    </linearGradient>
    <linearGradient id="gold-a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0e0a0"/>
      <stop offset="100%" style="stop-color:#d4af37"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#d4af37;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#d4af37;stop-opacity:0"/>
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="500" height="420" fill="url(#bg-about)" rx="12"/>
  <!-- Glow -->
  <circle cx="250" cy="210" r="200" fill="url(#glow)"/>
  <!-- Corner ornaments -->
  <text x="30" y="55" font-size="30" fill="#d4af37" opacity="0.25">❧</text>
  <text x="430" y="55" font-size="30" fill="#d4af37" opacity="0.25" transform="scale(-1,1) translate(-500,0)">❧</text>
  <!-- Gold border frame -->
  <rect x="20" y="20" width="460" height="380" rx="10" fill="none" stroke="#d4af37" stroke-width="1" stroke-dasharray="6,4" opacity="0.2"/>
  <!-- Central composition: large gift with flowers -->
  <!-- Main gift box -->
  <rect x="165" y="200" width="170" height="140" rx="10" fill="#2a6040" stroke="#d4af37" stroke-width="2.5"/>
  <rect x="155" y="180" width="190" height="36" rx="7" fill="#1f5432" stroke="#d4af37" stroke-width="2.5"/>
  <!-- Ribbon vertical -->
  <rect x="247" y="180" width="16" height="160" fill="url(#gold-a)" opacity="0.9"/>
  <!-- Ribbon horizontal on lid -->
  <rect x="155" y="192" width="190" height="16" fill="url(#gold-a)" opacity="0.9"/>
  <!-- Bow -->
  <ellipse cx="237" cy="170" rx="26" ry="17" transform="rotate(-32 237 170)" fill="url(#gold-a)" opacity="0.9"/>
  <ellipse cx="264" cy="170" rx="26" ry="17" transform="rotate(32 264 170)" fill="url(#gold-a)" opacity="0.9"/>
  <circle cx="250" cy="174" r="13" fill="#d4af37"/>
  <!-- Tag hanging -->
  <line x1="280" y1="174" x2="305" y2="148" stroke="#d4af37" stroke-width="1.5" opacity="0.7"/>
  <rect x="296" y="132" width="42" height="28" rx="4" fill="#1f5432" stroke="#d4af37" stroke-width="1.2"/>
  <text x="317" y="152" text-anchor="middle" font-family="Georgia,serif" font-size="10" fill="#d4af37">Just</text>
  <text x="317" y="163" text-anchor="middle" font-family="Georgia,serif" font-size="9" fill="#d4af37">for you</text>
  <!-- Flowers -->
  <circle cx="130" cy="250" r="22" fill="#1f5432" stroke="#d4af37" stroke-width="1.5"/>
  <circle cx="120" cy="238" r="12" fill="#2a6040" stroke="#d4af37" stroke-width="1"/>
  <circle cx="142" cy="238" r="12" fill="#2a6040" stroke="#d4af37" stroke-width="1"/>
  <circle cx="130" cy="228" r="12" fill="#2a6040" stroke="#d4af37" stroke-width="1"/>
  <circle cx="130" cy="250" r="8" fill="#d4af37" opacity="0.6"/>

  <circle cx="370" cy="255" r="22" fill="#1f5432" stroke="#d4af37" stroke-width="1.5"/>
  <circle cx="360" cy="243" r="12" fill="#2a6040" stroke="#d4af37" stroke-width="1"/>
  <circle cx="382" cy="243" r="12" fill="#2a6040" stroke="#d4af37" stroke-width="1"/>
  <circle cx="370" cy="233" r="12" fill="#2a6040" stroke="#d4af37" stroke-width="1"/>
  <circle cx="370" cy="255" r="8" fill="#d4af37" opacity="0.6"/>

  <!-- Leaf stems -->
  <path d="M130,272 Q140,290 155,300" fill="none" stroke="#2a6040" stroke-width="3"/>
  <path d="M370,277 Q360,292 345,302" fill="none" stroke="#2a6040" stroke-width="3"/>
  <!-- Small stars -->
  <text x="90" y="195" font-size="22" fill="#d4af37" opacity="0.5">✦</text>
  <text x="380" y="190" font-size="18" fill="#d4af37" opacity="0.45">✦</text>
  <text x="60" y="330" font-size="16" fill="#d4af37" opacity="0.35">✦</text>
  <text x="415" y="335" font-size="16" fill="#d4af37" opacity="0.35">✦</text>
  <!-- Brand text -->
  <text x="250" y="385" text-anchor="middle" font-family="Georgia,serif" font-size="22" font-style="italic" fill="#d4af37" letter-spacing="2" opacity="0.8">Aura Creations</text>
  <text x="250" y="405" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="#b8a878" letter-spacing="3">BY KAVYA P</text>
</svg>
